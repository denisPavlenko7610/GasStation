# Runs the EditMode tests on every push and pull request and builds the Windows version on tags
# (v*) or on demand. Needs repository secrets UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD
# (see https://game.ci/docs/github/activation).
name: Unity

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: Library-tests-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-windows-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: Library-windows-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildMethod: GasStation.Editor.BuildMenu.BuildWindowsFromCommandLine
      - uses: actions/upload-artifact@v4
        with:
          name: GasStation-Windows
          path: Builds/Windows
